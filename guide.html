<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manjula.xyz Deployment Guide</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1726'/%3E%3Cpath d='M16 20l12 12-12 12' fill='none' stroke='%23F5A524' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 45h16' stroke='%23F5A524' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0E1726">
<meta name="description" content="Step-by-step production deployment of Next.js, React and Laravel on one AWS Lightsail Ubuntu server behind Nginx and Cloudflare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root {
  --bg: #F5F3EE;
  --surface: #FCFBF8;
  --surface-2: #EFEBE3;
  --border: #E2DED4;
  --text: #0E1726;
  --muted: #475467;
  --faint: #5B6472;
  --accent: #B45309;
  --accent-soft: rgba(180, 83, 9, 0.10);
  --accent-border: #F0C9A0;
  --note-bg: #FFF6E8;
  --danger: #B42318;
  --danger-bg: #FDEDEA;
  --ok: #0F766E;
  --code-bg: #0E1726;
  --code-border: #1E2A40;
  --code-text: #D7E3F4;
  --code-muted: #8A94A6;
  --hero-panel: #0E1726;
  --hero-text: #F5F3EE;
  --shadow: 0 1px 2px rgba(14, 23, 38, 0.06), 0 8px 24px rgba(14, 23, 38, 0.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1220;
    --surface: #111B2E;
    --surface-2: #17233A;
    --border: #26354F;
    --text: #EEF1F6;
    --muted: #B8C4D6;
    --faint: #8A94A6;
    --accent: #F5A524;
    --accent-soft: rgba(245, 165, 36, 0.12);
    --accent-border: #6B4E1C;
    --note-bg: #1F1B14;
    --danger: #F97066;
    --danger-bg: #2A1418;
    --ok: #2DD4BF;
    --code-bg: #070D18;
    --code-border: #1E2A40;
    --code-text: #D7E3F4;
    --code-muted: #8A94A6;
    --hero-panel: #111B2E;
    --hero-text: #EEF1F6;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1220;
  --surface: #111B2E;
  --surface-2: #17233A;
  --border: #26354F;
  --text: #EEF1F6;
  --muted: #B8C4D6;
  --faint: #8A94A6;
  --accent: #F5A524;
  --accent-soft: rgba(245, 165, 36, 0.12);
  --accent-border: #6B4E1C;
  --note-bg: #1F1B14;
  --danger: #F97066;
  --danger-bg: #2A1418;
  --ok: #2DD4BF;
  --code-bg: #070D18;
  --code-border: #1E2A40;
  --code-text: #D7E3F4;
  --code-muted: #8A94A6;
  --hero-panel: #111B2E;
  --hero-text: #EEF1F6;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, h4 { font-family: 'Space Grotesk', 'IBM Plex Sans', Arial, sans-serif; line-height: 1.15; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.mono, code, pre { font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  height: 60px; display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--code-bg); display: grid; place-items: center; color: #F5A524; font: 700 14px/1 'JetBrains Mono', monospace; }
.topbar .spacer { flex: 1; }
.progress-text { font: 500 13px/1 'JetBrains Mono', monospace; color: var(--faint); white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 36px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface); color: var(--text);
  font-size: 14px; font-weight: 500; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFF8EC; }
:root[data-theme="dark"] .btn.primary { color: #0E1726; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0E1726; } }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; }
.kbd { font: 600 11px/1 'JetBrains Mono', monospace; padding: 3px 6px; border: 1px solid var(--border); border-radius: 5px; color: var(--faint); }
.progress-bar { position: absolute; left: 0; bottom: -1px; height: 3px; background: var(--accent); width: 0; transition: width .3s ease; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.sidebar {
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 20px 14px 40px;
}
.sidebar-head { display: flex; gap: 8px; margin-bottom: 18px; }
.sidebar-head .btn.icon { flex: none; height: 38px; width: 38px; border-radius: 10px; }
.search {
  flex: 1; min-width: 0; height: 38px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
}
.layout { transition: grid-template-columns .2s ease; }
@media (min-width: 961px) {
  body.sidebar-collapsed .layout { grid-template-columns: 0 minmax(0, 1fr); }
  body.sidebar-collapsed .sidebar { visibility: hidden; padding: 0; border: 0; overflow: hidden; }
}
.nav-group { margin-bottom: 18px; }
.nav-part { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; padding: 0 8px; font: 600 11px/1.4 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.nav-link {
  display: grid; grid-template-columns: 28px 1fr 16px; align-items: baseline; gap: 4px;
  padding: 5px 8px; border-radius: 8px;
  font-size: 14px; line-height: 1.4; color: var(--muted); text-decoration: none;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.active { background: var(--accent-soft); color: var(--text); font-weight: 500; }
.nav-link .n { font: 12px/1.4 'JetBrains Mono', monospace; color: var(--faint); }
.nav-link .tick { color: var(--ok); font-weight: 700; font-size: 13px; }
.nav-link.done .tick::before { content: "✓"; }
.nav-link[hidden], .nav-group[hidden] { display: none; }
.no-results { font-size: 14px; color: var(--faint); padding: 0 8px; }

main { padding: 40px clamp(16px, 5vw, 72px) 140px; min-width: 0; }
.content { max-width: 900px; margin: 0 auto; }

/* ---------- hero ---------- */
.hero { padding: 16px 0 24px; }
.eyebrow { margin: 0 0 14px; font: 600 12px/1.4 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hero-title { font-size: clamp(2.8rem, 7.5vw, 5.4rem); font-weight: 700; line-height: 1.02; letter-spacing: -0.03em; margin-bottom: 32px; }
.hero-title-tail { display: block; margin-top: 12px; font-size: 0.5em; letter-spacing: -0.01em; color: var(--accent); }
.hero-sub { font-size: clamp(1.7rem, 3.8vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; color: var(--muted); }
.lede { font-size: 1.2rem; color: var(--muted); max-width: 60ch; margin: 20px 0 32px; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.app-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
.app-card .domain { font: 600 13px/1.4 'JetBrains Mono', monospace; color: var(--accent); }
.app-card h3 { font-size: 1.25rem; margin: 6px 0 4px; }
.app-card p { margin: 0; color: var(--muted); font-size: 14px; }

.flow {
  display: flex; align-items: center; gap: 10px;
  background: var(--hero-panel); color: var(--hero-text);
  border-radius: 16px; padding: 22px; margin-bottom: 20px;
  border: 1px solid var(--code-border);
}
.flow .node { background: rgba(255,255,255,0.05); border: 1px solid #2A3A56; border-radius: 10px; padding: 10px 14px; font: 600 15px/1.3 'Space Grotesk', Arial, sans-serif; white-space: nowrap; }
.flow .node small { display: block; font: 400 12px/1.4 'JetBrains Mono', monospace; color: #8A94A6; margin-top: 2px; }
.flow .node.hot { border-color: #F5A524; color: #F5A524; }
.flow .arrow { flex: 1; min-width: 18px; height: 2px; background: #F5A524; position: relative; }
.flow .arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid #F5A524; border-right: 0; }
.flow .targets { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
.chip { font: 500 13px/1 'JetBrains Mono', monospace; padding: 8px 12px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hero-meta { margin: 18px 0 0; font-size: 14px; color: var(--faint); }

/* ---------- chapters ---------- */
.chapter {
  margin: 72px 0 8px; padding: 28px 32px;
  border-radius: 18px; background: var(--hero-panel); color: var(--hero-text);
  border: 1px solid var(--code-border);
  scroll-margin-top: 80px;
}
.chapter .eyebrow { color: #F5A524; margin-bottom: 8px; }
.chapter h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); }
.chapter p { margin: 8px 0 0; color: #B8C4D6; }
.chapter .range { font: 12px/1 'JetBrains Mono', monospace; color: #8A94A6; margin-top: 14px; display: block; }

/* ---------- steps ---------- */
.step { padding: 44px 0 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 64px; }
.step-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font: 500 13px/1 'JetBrains Mono', monospace; color: var(--faint); }
.step-num { padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.step.is-done .step-num { background: rgba(15, 118, 110, 0.12); color: var(--ok); }
.step.is-done .step-num::after { content: " ✓"; }
.step h2 { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700; letter-spacing: -0.01em; margin-bottom: 18px; }
.step-body h3 { font-size: 1.25rem; margin: 30px 0 10px; }
.step-body h4 { font-size: 1.05rem; margin: 24px 0 8px; color: var(--muted); }
.step-body p { margin: 0 0 14px; }
.step-body ul { margin: 0 0 16px; padding-left: 22px; }
.step-body li { margin: 4px 0; }
.label { margin: 22px 0 8px !important; font: 600 12px/1.4 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.label.danger-label { color: var(--danger); }
code:not(pre code) { font-size: .88em; background: var(--surface-2); border: 1px solid var(--border); padding: .08em .38em; border-radius: 6px; }

.code { position: relative; margin: 0 0 16px; border-radius: 12px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--code-border); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--code-border); font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--code-muted); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 14px; line-height: 1.6; color: var(--code-text); tab-size: 4; }
.copy { height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #2A3A56; background: transparent; color: #D7E3F4; font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .04em; }
.copy:hover { border-color: #F5A524; color: #F5A524; }
.copy.copied { border-color: #2DD4BF; color: #2DD4BF; }
.code.plain { background: var(--surface-2); border-color: var(--border); }
.code.plain pre { color: var(--text); font-size: 13.5px; }
.code.plain .code-head { border-color: var(--border); color: var(--faint); }
.code.danger { border-color: var(--danger); }
.code.danger .code-head { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.code.danger pre { opacity: .8; }
.code.plain.danger { background: var(--danger-bg); }

.var { border-radius: 4px; padding: 0 3px; background: rgba(245, 165, 36, 0.18); color: #F7C66B; outline: 1px dashed rgba(245, 165, 36, 0.7); }
.dom.filled { border-radius: 4px; padding: 0 2px; background: rgba(45, 212, 191, 0.15); color: #7EE8D8; }
.code.plain .dom.filled, code:not(pre code) .dom.filled, .step-body p > .dom.filled, .step-body li > .dom.filled, td > .dom.filled { color: var(--ok); }
.var.filled { outline: none; background: rgba(45, 212, 191, 0.15); color: #7EE8D8; }
.code.plain .var, code:not(pre code) .var { color: var(--accent); }
.code.plain .var.filled, code:not(pre code) .var.filled { color: var(--ok); }

.callout { padding: 12px 16px; border-radius: 10px; border-left: 4px solid; margin: 0 0 16px !important; }
.callout.warn { border-color: var(--danger); background: var(--danger-bg); }
.callout.key { border-color: var(--accent); background: var(--note-bg); font-size: 1.05rem; }

.table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
th { background: var(--surface-2); font: 600 12px/1.4 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
tr:last-child td { border-bottom: 0; }

.checklist { list-style: none; padding: 0 !important; display: grid; gap: 2px; }
.checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
.checklist label:hover { background: var(--surface-2); }
.checklist input { margin-top: 5px; accent-color: var(--ok); width: 16px; height: 16px; }
.checklist input:checked + span { color: var(--faint); text-decoration: line-through; }

.note { margin: 22px 0 16px; padding: 16px 20px; border-radius: 12px; background: var(--note-bg); border: 1px solid var(--accent-border); }
.note-title { display: flex; align-items: center; gap: 8px; margin: 0 0 6px !important; font: 600 12px/1.4 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.note p:last-child { margin: 0; }

.step-foot { display: flex; justify-content: flex-end; padding: 18px 0 28px; }
.done-toggle { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; font-size: 14px; color: var(--muted); cursor: pointer; background: var(--surface); }
.done-toggle input { accent-color: var(--ok); width: 16px; height: 16px; margin: 0; }
.done-toggle:has(input:checked) { border-color: var(--ok); color: var(--ok); }

/* ---------- title slide (present mode only) ---------- */
.title-slide { display: none; }
body.present .title-slide.current {
  display: flex; flex-direction: column; justify-content: center;
  position: fixed; inset: 0; z-index: 1; overflow-y: auto;
  padding: 64px clamp(16px, 7vw, 120px) 120px;
  background: radial-gradient(circle at 85% 15%, #3A2E1E 0%, #0E1726 60%);
  color: #F5F3EE;
}
.title-slide .eyebrow { color: #F5A524; font-size: 14px; margin-bottom: 24px; }
.title-slide h1 { font-size: clamp(3rem, 8vw, 6.5rem); font-weight: 700; line-height: 1.02; letter-spacing: -0.03em; color: #F5F3EE; }
.title-slide .ts-sub { margin: 28px 0 0; max-width: 46ch; font-size: clamp(1.1rem, 2vw, 1.5rem); line-height: 1.5; color: #B8C4D6; }
.ts-author { margin-top: 56px; padding-left: 18px; border-left: 3px solid #F5A524; }
.ts-author p { margin: 0; }
.ts-name { font: 700 clamp(1.1rem, 1.8vw, 1.4rem)/1.3 'Space Grotesk', Arial, sans-serif; color: #F5F3EE; }
.ts-role { margin-top: 4px !important; font-size: 1rem; color: #B8C4D6; }
.ts-hint { margin: 48px 0 0; font: 500 13px/1 'JetBrains Mono', monospace; color: #8A94A6; }

/* ---------- author ---------- */
.author { margin: 64px 0 0; padding: 28px 0 0; border-top: 3px solid var(--accent); }
.author p { margin: 0; }
.author-name { font: 700 1.25rem/1.3 'Space Grotesk', Arial, sans-serif; color: var(--text); }
.author-role { margin-top: 4px !important; font-size: 15px; color: var(--muted); }
body.present .author { display: none; }

/* ---------- values panel ---------- */
.panel {
  position: fixed; top: 72px; right: 16px; z-index: 40;
  width: min(380px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
  padding: 20px;
}
.panel[hidden] { display: none; }
.panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.panel h2 { font-size: 1.2rem; }
.panel > p { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field span { font: 600 11px/1.4 'JetBrains Mono', monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.field input { height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: 14px 'JetBrains Mono', monospace; }
.panel .hint { font-size: 12px; color: var(--faint); margin: 4px 0 0; }

/* ---------- present mode ---------- */
.present-bar { display: none; }
body.present .topbar, body.present .sidebar, body.present .hero, body.present .chapter { display: none; }
body.present .layout { display: block; }
body.present main { padding: 0; }
body.present .content { max-width: 1180px; }
body.present .step { display: none; border: 0; }
body.present .step.current { display: block; min-height: 100vh; padding: 56px clamp(16px, 5vw, 64px) 140px; font-size: 19px; }
body.present .step.current h2 { font-size: clamp(2rem, 4vw, 3rem); margin-bottom: 28px; }
body.present .code pre { font-size: 17px; }
body.present .step-foot { justify-content: flex-start; }
body.present .present-bar {
  display: flex; align-items: center; gap: 10px;
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50;
  padding: 8px; border-radius: 999px;
  background: var(--code-bg); color: #EEF1F6; border: 1px solid #2A3A56;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
}
.present-bar button { height: 36px; min-width: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A3A56; background: transparent; color: #EEF1F6; font-size: 14px; }
.present-bar button:hover { border-color: #F5A524; color: #F5A524; }
.present-bar .count { font: 600 13px/1 'JetBrains Mono', monospace; padding: 0 8px; white-space: nowrap; }
.present-bar .part { font-size: 13px; color: #8A94A6; padding-right: 6px; white-space: nowrap; max-width: 28vw; overflow: hidden; text-overflow: ellipsis; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 60px; left: 0; z-index: 25;
    width: min(320px, 86vw); background: var(--bg);
    transform: translateX(-100%); transition: transform .2s ease;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
  }
  body.nav-open .sidebar { transform: none; }
  .apps { grid-template-columns: 1fr; }
  .flow { flex-direction: column; align-items: stretch; }
  .flow .arrow { width: 2px; height: 18px; min-width: 0; flex: none; align-self: center; }
  .flow .arrow::after { right: -4px; top: auto; bottom: -1px; border: 5px solid transparent; border-top: 7px solid #F5A524; border-bottom: 0; }
  .flow .node { white-space: normal; }
}
@media (max-width: 640px) {
  .topbar { padding: 0 12px; gap: 8px; }
  .brand-text, .progress-text, .hide-sm { display: none; }
  .chapter { padding: 22px 20px; }
  .present-bar .part { display: none; }
}

# Manjula.xyz Production Deployment Guide

## AWS Lightsail + Ubuntu + Nginx + Next.js + React + Laravel + MySQL + PHP 8.4 + PM2 + Cloudflare + Certbot

This guide describes how to deploy three applications on a single AWS Lightsail Ubuntu VPS:

| Application | Domain | Technology |
|---|---|---|
| Landing website | `manjula.xyz` | Next.js |
| Dashboard | `app.manjula.xyz` | React/Vite |
| Backend API | `api.manjula.xyz` | Laravel + PHP 8.4 |

Additional infrastructure:

- AWS Lightsail Ubuntu VPS
- Nginx
- MySQL
- PHP 8.4 + PHP-FPM
- Composer
- Node.js
- PM2
- Supervisor
- Cloudflare DNS + Proxy
- Let's Encrypt + Certbot
- UFW firewall
- Optional Redis
- Optional swap

---

# 1. Final Architecture

```text
                         Internet
                            |
                    +-------v--------+
                    |   Cloudflare   |
                    | DNS + Proxy    |
                    +-------+--------+
                            |
                            | HTTPS
                            v
              +---------------------------+
              | AWS Lightsail Ubuntu VPS  |
              |                           |
              |          NGINX            |
              |       :80 / :443          |
              +------+--------+-----------+
                     |        |
          +----------+        +----------------+
          |                                   |
          v                                   v
   manjula.xyz                         app.manjula.xyz
   Next.js :3000                       React static files
   PM2
          |
          |
          +--------------------+
                               |
                               v
                       api.manjula.xyz
                       Laravel + PHP 8.4
                               |
                               v
                             MySQL
```

Recommended application directory structure:

```text
/var/www/
└── manjula/
    ├── landing/
    ├── dashboard/
    └── backend/
```

Laravel's public directory:

```text
/var/www/manjula/backend/public
```

---

# 2. Domain Configuration

Final DNS records:

| Type | Name | Target | Proxy |
|---|---|---|---|
| A | `@` | Lightsail Static IP | Proxied |
| CNAME | `www` | `manjula.xyz` | Proxied |
| A | `app` | Lightsail Static IP | Proxied |
| A | `api` | Lightsail Static IP | Proxied |

Final URLs:

```text
https://manjula.xyz
https://www.manjula.xyz
https://app.manjula.xyz
https://api.manjula.xyz
```

---

# 3. Create AWS Lightsail Instance

Create an AWS Lightsail instance:

```text
Platform:
Linux/Unix

Operating system:
Ubuntu
```

Recommended minimum for a small deployment:

```text
2 GB RAM
1-2 vCPU
40-60 GB SSD
```

For heavier Laravel applications, builds, MySQL workloads, or multiple sites, use:

```text
4 GB RAM
2 vCPU
```

---

# 4. Create and Attach a Static IP

In AWS Lightsail:

```text
Networking
    ->
Create static IP
    ->
Select the instance
    ->
Attach
```

Do this before configuring Cloudflare DNS.

After connecting to the server:

```bash
curl -4 ifconfig.me
```

Save this IP as:

```text
YOUR_SERVER_IP
```

---

# 5. Configure Lightsail Firewall

Open only:

```text
SSH     TCP 22
HTTP    TCP 80
HTTPS   TCP 443
```

Do NOT expose:

```text
3000
3306
6379
8000
8080
```

Next.js, MySQL, Redis and other internal services should remain private.

---

# 6. Connect to Ubuntu

From Windows PowerShell:

```bash
ssh ubuntu@YOUR_SERVER_IP
```

Check Ubuntu:

```bash
cat /etc/os-release
```

Check architecture:

```bash
uname -m
```

---

# 7. Update Ubuntu

```bash
sudo apt update
sudo apt upgrade -y
```

Install common tools:

```bash
sudo apt install -y \
    curl \
    wget \
    git \
    unzip \
    zip \
    vim \
    nano \
    htop \
    software-properties-common \
    ca-certificates \
    gnupg \
    lsb-release \
    ufw
```

Reboot:

```bash
sudo reboot
```

Reconnect:

```bash
ssh ubuntu@YOUR_SERVER_IP
```

---

# 8. Configure UFW

Check:

```bash
sudo ufw status
```

Allow SSH:

```bash
sudo ufw allow 22/tcp
```

Allow HTTP:

```bash
sudo ufw allow 80/tcp
```

Allow HTTPS:

```bash
sudo ufw allow 443/tcp
```

Enable:

```bash
sudo ufw enable
```

Check:

```bash
sudo ufw status verbose
```

Expected:

```text
22/tcp   ALLOW
80/tcp   ALLOW
443/tcp  ALLOW
```

Do NOT run:

```bash
sudo ufw allow 3000
sudo ufw allow 3306
```

---

# 9. Install Nginx

```bash
sudo apt install -y nginx
```

Start:

```bash
sudo systemctl start nginx
```

Enable at boot:

```bash
sudo systemctl enable nginx
```

Check:

```bash
sudo systemctl status nginx
```

Test:

```bash
curl http://127.0.0.1
```

Check version:

```bash
nginx -v
```

---

# 10. Configure Cloudflare DNS

Add `manjula.xyz` to Cloudflare.

Change the domain's nameservers at your registrar to the Cloudflare nameservers provided by Cloudflare.

In:

```text
Cloudflare
    ->
manjula.xyz
    ->
DNS
    ->
Records
```

Create:

### Apex domain

```text
Type: A
Name: @
IPv4: YOUR_SERVER_IP
Proxy: Proxied
```

### WWW

```text
Type: CNAME
Name: www
Target: manjula.xyz
Proxy: Proxied
```

### Dashboard

```text
Type: A
Name: app
IPv4: YOUR_SERVER_IP
Proxy: Proxied
```

### API

```text
Type: A
Name: api
IPv4: YOUR_SERVER_IP
Proxy: Proxied
```

Verify DNS:

```bash
nslookup manjula.xyz
nslookup app.manjula.xyz
nslookup api.manjula.xyz
```

Or:

```bash
dig manjula.xyz
dig app.manjula.xyz
dig api.manjula.xyz
```

- `nslookup` = quick DNS lookup
- `dig` = detailed DNS investigation

If `dig` is unavailable:

```bash
sudo apt install -y dnsutils
```

Because Cloudflare Proxy is enabled, DNS may return Cloudflare IP addresses rather than the Lightsail IP. This is expected.

---

# 11. Install MySQL

```bash
sudo apt install -y mysql-server
```

Enable:

```bash
sudo systemctl enable mysql
```

Start:

```bash
sudo systemctl start mysql
```

Check:

```bash
sudo systemctl status mysql
```

---

# 12. Secure MySQL

Run:

```bash
sudo mysql_secure_installation
```

Remove or disable:

- Anonymous users
- Remote root login
- Test database
- Other unnecessary defaults

---

# 13. Create Laravel Database

Login:

```bash
sudo mysql
```

Create database:

```sql
CREATE DATABASE manjula_db
CHARACTER SET utf8mb4
COLLATE utf8mb4_unicode_ci;
```

Create user:

```sql
CREATE USER 'manjula_user'@'localhost'
IDENTIFIED BY 'YOUR_STRONG_PASSWORD';
```

Grant privileges:

```sql
GRANT ALL PRIVILEGES ON manjula_db.*
TO 'manjula_user'@'localhost';
```

Apply:

```sql
FLUSH PRIVILEGES;
```

Exit:

```sql
EXIT;
```

Test:

```bash
mysql -u manjula_user -p manjula_db
```

---

# 14. Keep MySQL Private

Check:

```bash
sudo ss -lntp | grep 3306
```

MySQL should not be publicly accessible.

The architecture should be:

```text
Laravel
   |
   v
127.0.0.1:3306
   |
   v
MySQL
```

Never expose MySQL directly to the Internet.

---

# 15. Install PHP 8.4

Check Ubuntu version:

```bash
lsb_release -a
```

For Ubuntu versions where PHP 8.4 is not available from the standard repository, add the maintained PHP PPA:

```bash
sudo add-apt-repository ppa:ondrej/php
```

Then:

```bash
sudo apt update
```

Install PHP 8.4:

```bash
sudo apt install -y \
    php8.4 \
    php8.4-fpm \
    php8.4-cli \
    php8.4-mysql \
    php8.4-mbstring \
    php8.4-xml \
    php8.4-curl \
    php8.4-zip \
    php8.4-bcmath \
    php8.4-intl \
    php8.4-gd \
    php8.4-soap
```

Check:

```bash
php -v
```

Expected:

```text
PHP 8.4.x
```

---

# 16. Configure PHP-FPM

Check:

```bash
sudo systemctl status php8.4-fpm
```

Enable:

```bash
sudo systemctl enable php8.4-fpm
```

Start:

```bash
sudo systemctl start php8.4-fpm
```

Find the socket:

```bash
ls -la /run/php/
```

Expected:

```text
php8.4-fpm.sock
```

Nginx will use:

```text
/run/php/php8.4-fpm.sock
```

---

# 17. Make PHP 8.4 Default

Check:

```bash
php -v
```

If another PHP version is selected:

```bash
sudo update-alternatives --config php
```

Select:

```text
/usr/bin/php8.4
```

Check:

```bash
php -v
```

---

# 18. Install Composer

```bash
cd /tmp
```

Download installer:

```bash
php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
```

Install:

```bash
sudo php composer-setup.php \
    --install-dir=/usr/local/bin \
    --filename=composer
```

Remove installer:

```bash
rm composer-setup.php
```

Check:

```bash
composer --version
```

---

# 19. Install Node.js

Use NVM:

```bash
curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
```

Reload:

```bash
source ~/.bashrc
```

Check:

```bash
nvm --version
```

Install Node.js LTS:

```bash
nvm install --lts
```

Use it:

```bash
nvm use --lts
```

Check:

```bash
node -v
npm -v
```

---

# 20. Install PM2

```bash
npm install -g pm2
```

Check:

```bash
pm2 -v
```

Check Node location:

```bash
which node
```

---

# 21. Create Application Directories

```bash
sudo mkdir -p /var/www/manjula
```

Create:

```bash
sudo mkdir -p /var/www/manjula/landing
sudo mkdir -p /var/www/manjula/dashboard
sudo mkdir -p /var/www/manjula/backend
```

Change ownership:

```bash
sudo chown -R ubuntu:ubuntu /var/www/manjula
```

Final structure:

```text
/var/www/manjula/
├── landing/
├── dashboard/
└── backend/
```

---

# 22. Deploy Laravel Backend

```bash
cd /var/www/manjula
```

Clone repository:

```bash
git clone YOUR_LARAVEL_REPOSITORY backend
```

Or update an existing repository:

```bash
cd /var/www/manjula/backend
git pull
```

---

# 23. Install Laravel Dependencies

```bash
cd /var/www/manjula/backend
```

```bash
composer install \
    --no-dev \
    --optimize-autoloader
```

---

# 24. Configure Laravel .env

Copy:

```bash
cp .env.example .env
```

Edit:

```bash
nano .env
```

Example:

```env
APP_NAME=Manjula
APP_ENV=production
APP_KEY=
APP_DEBUG=false
APP_URL=https://api.manjula.xyz

LOG_CHANNEL=stack
LOG_LEVEL=error

DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE=manjula_db
DB_USERNAME=manjula_user
DB_PASSWORD=YOUR_STRONG_PASSWORD
```

Important:

```env
APP_DEBUG=false
```

Never use `APP_DEBUG=true` in production.

---

# 25. Generate Laravel Key

```bash
php artisan key:generate
```

Check:

```bash
grep APP_KEY .env
```

---

# 26. Run Laravel Migrations

```bash
php artisan migrate --force
```

If seeders are required:

```bash
php artisan db:seed --force
```

Or:

```bash
php artisan migrate --seed --force
```

---

# 27. Create Laravel Storage Link

```bash
php artisan storage:link
```

---

# 28. Configure Laravel Permissions

Set ownership:

```bash
sudo chown -R ubuntu:www-data /var/www/manjula/backend
```

Set writable directories:

```bash
sudo chown -R www-data:www-data \
    /var/www/manjula/backend/storage \
    /var/www/manjula/backend/bootstrap/cache
```

Set permissions:

```bash
sudo chmod -R 775 \
    /var/www/manjula/backend/storage \
    /var/www/manjula/backend/bootstrap/cache
```

Do NOT use:

```bash
chmod -R 777 /var/www/manjula/backend
```

---

# 29. Optimize Laravel

```bash
cd /var/www/manjula/backend
```

```bash
php artisan optimize
```

Optionally:

```bash
php artisan config:cache
php artisan route:cache
php artisan view:cache
```

Use `route:cache` only if your routes support route caching.

Check:

```bash
php artisan about
```

---

# 30. Create Laravel Nginx Configuration

Create:

```bash
sudo nano /etc/nginx/sites-available/api.manjula.xyz
```

Use:

```nginx
server {
    listen 80;
    listen [::]:80;

    server_name api.manjula.xyz;

    root /var/www/manjula/backend/public;

    index index.php index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
```

---

# 31. Enable Laravel Nginx Site

```bash
sudo ln -s \
    /etc/nginx/sites-available/api.manjula.xyz \
    /etc/nginx/sites-enabled/api.manjula.xyz
```

Test:

```bash
sudo nginx -t
```

Reload:

```bash
sudo systemctl reload nginx
```

Test locally:

```bash
curl -H "Host: api.manjula.xyz" http://127.0.0.1
```

---

# 32. Deploy React Dashboard

Assuming the dashboard uses Vite:

```bash
cd /var/www/manjula
```

Clone:

```bash
git clone YOUR_REACT_REPOSITORY dashboard
```

Enter:

```bash
cd /var/www/manjula/dashboard
```

Install:

```bash
npm install
```

---

# 33. React Production Environment

Create:

```bash
nano .env.production
```

Example:

```env
VITE_API_URL=https://api.manjula.xyz
```

Build:

```bash
npm run build
```

Vite normally creates:

```text
dist/
```

Check:

```bash
ls -la
```

Important:

Do not put database passwords or private secrets into `VITE_*` variables because they are compiled into the browser bundle.

---

# 34. React Nginx Configuration

Create:

```bash
sudo nano /etc/nginx/sites-available/app.manjula.xyz
```

Use:

```nginx
server {
    listen 80;
    listen [::]:80;

    server_name app.manjula.xyz;

    root /var/www/manjula/dashboard/dist;

    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
```

The following is important for React Router:

```nginx
try_files $uri $uri/ /index.html;
```

Enable:

```bash
sudo ln -s \
    /etc/nginx/sites-available/app.manjula.xyz \
    /etc/nginx/sites-enabled/app.manjula.xyz
```

Test:

```bash
sudo nginx -t
```

Reload:

```bash
sudo systemctl reload nginx
```

Test:

```bash
curl -H "Host: app.manjula.xyz" http://127.0.0.1
```

---

# 35. Deploy Next.js Landing Website

```bash
cd /var/www/manjula
```

Clone:

```bash
git clone YOUR_NEXTJS_REPOSITORY landing
```

Enter:

```bash
cd /var/www/manjula/landing
```

Install:

```bash
npm install
```

---

# 36. Configure Next.js Environment

Create:

```bash
nano .env.production
```

Example:

```env
NEXT_PUBLIC_API_URL=https://api.manjula.xyz
```

Remember:

```text
NEXT_PUBLIC_*
```

variables are exposed to the browser.

Do not put private secrets into public variables.

---

# 37. Verify Next.js package.json

Your package should have:

```json
{
  "scripts": {
    "dev": "next dev",
    "build": "next build",
    "start": "next start"
  }
}
```

---

# 38. Build Next.js

```bash
npm run build
```

Test manually:

```bash
npm start
```

It should run on:

```text
127.0.0.1:3000
```

Test from another terminal:

```bash
curl http://127.0.0.1:3000
```

Stop with:

```text
CTRL+C
```

---

# 39. Run Next.js with PM2

```bash
pm2 start npm \
    --name manjula-landing \
    -- start -- -p 3000
```

Check:

```bash
pm2 status
```

Check logs:

```bash
pm2 logs manjula-landing
```

Test:

```bash
curl http://127.0.0.1:3000
```

---

# 40. Configure PM2 Startup

Save:

```bash
pm2 save
```

Generate startup command:

```bash
pm2 startup
```

PM2 will output a command similar to:

```bash
sudo env PATH=$PATH:/home/ubuntu/.nvm/versions/node/vXX/bin \
    /home/ubuntu/.nvm/versions/node/vXX/lib/node_modules/pm2/bin/pm2 \
    startup systemd -u ubuntu --hp /home/ubuntu
```

Run the exact command shown by PM2.

Then:

```bash
pm2 save
```

Test after reboot:

```bash
sudo reboot
```

Reconnect and check:

```bash
pm2 status
```

---

# 41. Next.js Nginx Configuration

Create:

```bash
sudo nano /etc/nginx/sites-available/manjula.xyz
```

Use:

```nginx
server {
    listen 80;
    listen [::]:80;

    server_name manjula.xyz www.manjula.xyz;

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
```

Enable:

```bash
sudo ln -s \
    /etc/nginx/sites-available/manjula.xyz \
    /etc/nginx/sites-enabled/manjula.xyz
```

---

# 42. Remove Nginx Default Site

Check:

```bash
ls -la /etc/nginx/sites-enabled/
```

If `default` exists:

```bash
sudo rm /etc/nginx/sites-enabled/default
```

Test:

```bash
sudo nginx -t
```

Reload:

```bash
sudo systemctl reload nginx
```

---

# 43. Test All Nginx Virtual Hosts

Check:

```bash
sudo nginx -T | grep server_name
```

You should see:

```text
server_name manjula.xyz www.manjula.xyz;
server_name app.manjula.xyz;
server_name api.manjula.xyz;
```

Test:

```bash
curl -H "Host: manjula.xyz" http://127.0.0.1
```

```bash
curl -H "Host: app.manjula.xyz" http://127.0.0.1
```

```bash
curl -H "Host: api.manjula.xyz" http://127.0.0.1
```

---

# 44. Cloudflare SSL Configuration

In Cloudflare:

```text
SSL/TLS
    ->
Overview
```

Set:

```text
Full (strict)
```

Do NOT use Flexible SSL for this architecture.

Desired connection:

```text
Browser
   |
   | HTTPS
   v

# 80. Recommended Final Architecture

```text
                         CLOUDFLARE
                    DNS + Proxy + SSL
                            |
          +-----------------+------------------+
          |                 |                  |
          v                 v                  v
   manjula.xyz       app.manjula.xyz    api.manjula.xyz
          |                 |                  |
          v                 v                  v
       NGINX             NGINX              NGINX
          |                 |                  |
          v                 v                  v
     localhost:3000      React/dist        PHP-FPM
          |                                    |
          v                                    v
       PM2                                  Laravel
                                               |
                                               v
                                            MySQL
```

The key production principle is:

**Nginx should be the only public application entry point.**

Next.js runs privately on `127.0.0.1:3000`, MySQL remains private, PHP-FPM uses a local Unix socket, and Laravel is exposed through the Nginx API virtual host.

This structure also makes it easy to add future applications:

```text
blog.manjula.xyz
admin.manjula.xyz
status.manjula.xyz
files.manjula.xyz
api-v2.manjula.xyz
```

without requiring a separate VPS for every application.

      if (/^\|/.test(l)) {
        const rows = [];
        while (i < ls.length && /^\|/.test(ls[i])) { rows.push(ls[i]); i++; }
        out.push(table(rows));
        continue;
      }
      if (/^- /.test(l)) {
        const items = [];
        while (i < ls.length && /^- /.test(ls[i])) { items.push(ls[i].slice(2)); i++; }
        if (items.every(t => /^\[[ xX]\] /.test(t))) {
          out.push('<ul class="checklist">' + items.map(t => {
            ck++;
            return `<li><label><input type="checkbox" data-check="ck-${n}-${ck}"><span>${inline(t.slice(4))}</span></label></li>`;
          }).join('') + '</ul>');
        } else {
          out.push('<ul>' + items.map(t => `<li>${inline(t)}</li>`).join('') + '</ul>');
        }
        continue;
      }
      const buf = [];
      while (i < ls.length && !/^\s*$/.test(ls[i]) && !/^(```|#{1,4} |\||- |---)/.test(ls[i])) { buf.push(ls[i]); i++; }
      if (!buf.length) { buf.push(l); i++; }
      const text = buf.join(' ');
      if (/^(Do NOT|Do not use|Never|Avoid)\b/.test(text) && /:$/.test(text)) {
        out.push(`<p class="label danger-label">${inline(text.replace(/:$/, ''))}</p>`);
        dangerNext = true;
      } else if (/:$/.test(text) && text.length < 48) {
        out.push(`<p class="label">${inline(text.replace(/:$/, ''))}</p>`);
      } else if (/^(Never|Do not|Do NOT|Avoid)\b/.test(text)) {
        out.push(`<p class="callout warn">${inline(text)}</p>`);
      } else if (/^\*\*.*\*\*$/.test(text)) {
        out.push(`<p class="callout key">${inline(text)}</p>`);
      } else {
        out.push(`<p>${inline(text)}</p>`);
      }
    }
    return out.join('');
  }

  /* ---------- parse the guide ---------- */
  const lines = document.getElementById('guide-md').textContent.replace(/\r\n/g, '\n').split('\n');
  const intro = [];
  const steps = [];
  let cur = null;
  for (const l of lines) {
    const m = l.match(/^# (\d+)\.\s+(.*)$/);
    if (m) { cur = { n: +m[1], title: m[2], lines: [] }; steps.push(cur); continue; }
    if (cur) cur.lines.push(l); else intro.push(l);
  }
  steps.forEach(s => {
    const ch = CHAPTERS.find(c => s.n >= c.from && s.n <= c.to) || CHAPTERS[CHAPTERS.length - 1];
    s.chapter = ch;
    s.search = (s.title + ' ' + s.lines.join(' ')).toLowerCase();
  });

  const title = ((intro.find(l => /^# /.test(l)) || '# Deployment Guide').slice(2)).replace(/ Production Deployment Guide$/, '');
  const subtitle = (intro.find(l => /^## /.test(l)) || '').slice(3);
  const desc = (intro.find(l => /^This guide/.test(l)) || '').replace(/:$/, '.');
  const appRows = intro.filter(l => /^\|/.test(l)).slice(2).map(r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
  const chips = intro.filter(l => /^- /.test(l)).map(l => l.slice(2));

  /* ---------- build the page ---------- */
  let html = `
  <section class="title-slide" id="title-slide" aria-label="Title slide">
    <p class="eyebrow">Practical demo · <span class="dom">manjula.xyz</span></p>
    <h1>From Localhost<br>to Production</h1>
    <p class="ts-sub">Next.js, React and Laravel on one AWS Lightsail server, behind Nginx and Cloudflare</p>
    <div class="ts-author">
      <p class="ts-name">By Manjula Wijayasingha</p>
      <p class="ts-role">Engineer - Software Division</p>
    </div>
    <p class="ts-hint">Press → to begin</p>
  </section>
  <section class="hero" id="top">
    <h1 class="hero-title">From Localhost<br>to Production <span class="hero-title-tail">using AWS Lightsail</span></h1>
    <p class="eyebrow">Production deployment guide</p>
    <h2 class="hero-sub">${domainify(esc(title))} in production</h2>
    <p class="lede">${inline(desc)}</p>
    <div class="apps">${appRows.map(r => `
      <div class="app-card"><div class="domain">${domainify(esc(r[1].replace(/`/g, '')))}</div><h3>${esc(r[0])}</h3><p>${esc(r[2])}</p></div>`).join('')}
    </div>
    <div class="flow" role="img" aria-label="Request flow: Browser to Cloudflare to Nginx, which routes to Next.js, React or Laravel">
      <div class="node">Browser<small>visitors</small></div><div class="arrow"></div>
      <div class="node">Cloudflare<small>DNS · proxy · TLS</small></div><div class="arrow"></div>
      <div class="node hot">Nginx<small>:80 / :443 only</small></div><div class="arrow"></div>
      <div class="targets">
        <div class="node">Next.js<small>127.0.0.1:3000 · PM2</small></div>
        <div class="node">React<small>dist/ static files</small></div>
        <div class="node">Laravel<small>PHP-FPM → MySQL</small></div>
      </div>
    </div>
    <div class="chips">${chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</div>
    <div class="hero-actions">
      <a class="btn primary" href="#step-1">Start at step 1</a>
      <button class="btn" type="button" data-action="present">Present step by step</button>
      <button class="btn" type="button" data-action="vars">Fill in your values</button>
    </div>
    <p class="hero-meta">${steps.length} steps in ${CHAPTERS.length} parts · ${esc(subtitle)}</p>
  </section>`;

  let nav = '';
  CHAPTERS.forEach((ch, ci) => {
    const chSteps = steps.filter(s => s.chapter === ch);
    if (!chSteps.length) return;
    html += `
    <div class="chapter" id="part-${ci + 1}">
      <p class="eyebrow">Part ${ci + 1}</p>
      <h2>${esc(ch.name)}</h2>
      <p>${domainify(esc(ch.desc))}</p>
      <span class="range">Steps ${ch.from}–${ch.to}</span>
    </div>`;
    nav += `<div class="nav-group" data-part="${ci + 1}"><p class="nav-part">${ci + 1} · ${esc(ch.name)}</p>`;
    chSteps.forEach(s => {
      const note = NOTES[s.n] ? `<aside class="note"><p class="note-title">⚑ Reviewer note</p><p>${NOTES[s.n]}</p></aside>` : '';
      html += `
    <section class="step" id="step-${s.n}" data-n="${s.n}">
      <p class="step-meta"><span class="step-num">Step ${s.n}</span><span>${esc(ch.name)}</span></p>
      <h2>${inline(s.title)}</h2>
      <div class="step-body">${renderBlocks(s.lines, s.n)}${note}</div>
      <footer class="step-foot"><label class="done-toggle"><input type="checkbox" data-done="${s.n}"><span>Mark step done</span></label></footer>
    </section>`;
      nav += `<a class="nav-link" href="#step-${s.n}" data-n="${s.n}"><span class="n">${s.n}</span><span class="t">${domainify(esc(s.title))}</span><span class="tick" aria-hidden="true"></span></a>`;
    });
    nav += '</div>';
  });

  html += `
  <footer class="author">
    <p class="author-name">By Manjula Wijayasingha</p>
    <p class="author-role">Engineer - Software Division</p>
  </footer>`;

  document.getElementById('content').innerHTML = html;
  document.getElementById('nav').innerHTML = nav;

  const stepEls = [...document.querySelectorAll('.step')];
  const navLinks = new Map([...document.querySelectorAll('.nav-link')].map(a => [a.dataset.n, a]));

  /* ---------- progress ---------- */
  let done = new Set(store.get('mxg-done', []).map(String));
  let checks = new Set(store.get('mxg-checks', []));

  function renderProgress() {
    stepEls.forEach(el => {
      const n = el.dataset.n, isDone = done.has(n);
      el.classList.toggle('is-done', isDone);
      el.querySelector('[data-done]').checked = isDone;
      const a = navLinks.get(n);
      if (a) a.classList.toggle('done', isDone);
    });
    document.getElementById('progress-text').textContent = `${done.size} / ${stepEls.length} done`;
    document.getElementById('progress-bar').style.width = (done.size / stepEls.length * 100) + '%';
    const cur = document.body.classList.contains('present') ? stepEls[presentIdx - 1] : null;
    if (cur) document.getElementById('present-done').textContent = done.has(cur.dataset.n) ? 'Done ✓' : 'Mark done';
  }
  function setDone(n, on) {
    n = String(n);
    on ? done.add(n) : done.delete(n);
    store.set('mxg-done', [...done]);
    renderProgress();
  }
  document.querySelectorAll('[data-check]').forEach(cb => { cb.checked = checks.has(cb.dataset.check); });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-done]')) setDone(t.dataset.done, t.checked);
    if (t.matches('[data-check]')) {
      t.checked ? checks.add(t.dataset.check) : checks.delete(t.dataset.check);
      store.set('mxg-checks', [...checks]);
    }
  });

  /* ---------- your values ---------- */
  const saved = store.get('mxg-vars', {});
  const values = {};
  const fields = document.getElementById('vars-fields');
  fields.innerHTML = VARS.map(v => `
    <label class="field"><span>${esc(v.label)}</span>
      <input type="${v.secret ? 'password' : 'text'}" data-var-input="${v.key}" placeholder="${esc(v.ph)}" autocomplete="off" spellcheck="false">
    </label>`).join('');
  VARS.forEach(v => { if (!v.secret && saved[v.key]) values[v.key] = saved[v.key]; });
  fields.querySelectorAll('input').forEach(inp => { inp.value = values[inp.dataset.varInput] || ''; });

  function renderVars() {
    const dom = values.DOMAIN || DEFAULT_DOMAIN;
    document.querySelectorAll('.dom').forEach(s => {
      s.textContent = dom;
      s.classList.toggle('filled', !!values.DOMAIN && !s.closest('.brand, h1, h2, .nav-link, .app-card, .chapter, .title-slide'));
    });
    document.title = (values.DOMAIN ? dom : 'Manjula.xyz') + ' Deployment Guide';
    document.querySelectorAll('.var').forEach(s => {
      const v = values[s.dataset.var];
      s.textContent = v || s.dataset.var;
      s.classList.toggle('filled', !!v);
    });
  }
  fields.addEventListener('input', e => {
    const k = e.target.dataset.varInput;
    if (!k) return;
    values[k] = k === 'DOMAIN' ? cleanDomain(e.target.value) : e.target.value.trim();
    const toSave = {};
    VARS.forEach(v => { if (!v.secret && values[v.key]) toSave[v.key] = values[v.key]; });
    store.set('mxg-vars', toSave);
    renderVars();
  });
  renderVars();

  /* ---------- copy ---------- */
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? res() : rej(); } catch (err) { rej(err); }
      ta.remove();
    });
  }

  /* ---------- theme ---------- */
  const root = document.documentElement;
  const savedTheme = store.get('mxg-theme', null);
  if (savedTheme) root.dataset.theme = savedTheme;
  function toggleTheme() {
    const isDark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = isDark ? 'light' : 'dark';
    store.set('mxg-theme', root.dataset.theme);
  }

  /* ---------- active step tracking ---------- */
  let activeN = null;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting || document.body.classList.contains('present')) return;
      const n = en.target.dataset.n;
      if (n === activeN) return;
      if (activeN && navLinks.get(activeN)) navLinks.get(activeN).classList.remove('active');
      activeN = n;
      const a = navLinks.get(n);
      if (a) {
        a.classList.add('active');
        const sb = document.querySelector('.sidebar');
        const r = a.getBoundingClientRect(), sr = sb.getBoundingClientRect();
        if (r.top < sr.top + 40 || r.bottom > sr.bottom - 40) sb.scrollTop += r.top - sr.top - sr.height / 3;
      }
    });
  }, { rootMargin: '-25% 0px -65% 0px' });
  stepEls.forEach(el => io.observe(el));

  /* ---------- search ---------- */
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    let any = false;
    document.querySelectorAll('.nav-group').forEach(g => {
      let shown = 0;
      g.querySelectorAll('.nav-link').forEach(a => {
        const s = steps.find(x => String(x.n) === a.dataset.n);
        const text = values.DOMAIN ? s.search.split(DEFAULT_DOMAIN).join(values.DOMAIN) : s.search;
        const hit = !q || text.includes(q);
        a.hidden = !hit;
        if (hit) shown++;
      });
      g.hidden = shown === 0;
      if (shown) any = true;
    });
    document.getElementById('no-results').hidden = any;
  });

  /* ---------- presenter mode ---------- */
  // Slide 0 is the title slide; slides 1…80 are the steps.
  const titleSlide = document.getElementById('title-slide');
  const slides = [titleSlide, ...stepEls];
  let presentIdx = 0;
  function showStep(i) {
    presentIdx = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((el, k) => el.classList.toggle('current', k === presentIdx));
    const el = slides[presentIdx];
    const isTitle = el === titleSlide;
    document.getElementById('present-count').textContent = isTitle ? 'Title' : `${presentIdx} / ${stepEls.length}`;
    document.getElementById('present-part').textContent = isTitle ? '' : steps[presentIdx - 1].chapter.name;
    document.getElementById('present-done').hidden = isTitle;
    renderProgress();
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', isTitle ? location.pathname + location.search : '#step-' + el.dataset.n); } catch (e) {}
  }
  function enterPresent() {
    const start = activeN ? slides.findIndex(el => el.dataset.n === activeN) : 0;
    document.body.classList.remove('nav-open');
    document.getElementById('vars-panel').hidden = true;
    document.body.classList.add('present');
    showStep(start < 0 ? 0 : start);
  }
  function exitPresent() {
    document.body.classList.remove('present');
    slides.forEach(el => el.classList.remove('current'));
    if (slides[presentIdx] === titleSlide) window.scrollTo(0, 0);
    else slides[presentIdx].scrollIntoView({ block: 'start', behavior: 'instant' });
  }
  function toggleCurrentDone() {
    const el = slides[presentIdx];
    if (el && el !== titleSlide) setDone(el.dataset.n, !done.has(el.dataset.n));
  }

  /* ---------- sidebar collapse ---------- */
  const isMobile = () => matchMedia('(max-width: 960px)').matches;
  function setCollapsed(on) {
    document.body.classList.toggle('sidebar-collapsed', on);
    store.set('mxg-sidebar-collapsed', on);
  }
  function toggleSidebar() {
    if (isMobile()) document.body.classList.toggle('nav-open');
    else setCollapsed(!document.body.classList.contains('sidebar-collapsed'));
  }
  if (store.get('mxg-sidebar-collapsed', false)) document.body.classList.add('sidebar-collapsed');

  /* ---------- clicks ---------- */
  document.addEventListener('click', e => {
    const copy = e.target.closest('.copy');
    if (copy) {
      const code = copy.closest('.code').querySelector('code');
      copyText(code.innerText).then(() => {
        copy.textContent = 'Copied'; copy.classList.add('copied');
        setTimeout(() => { copy.textContent = 'Copy'; copy.classList.remove('copied'); }, 1400);
      }, () => { copy.textContent = 'Select & copy'; });
      return;
    }
    const act = e.target.closest('[data-action]');
    if (act) {
      const a = act.dataset.action;
      if (a === 'present') enterPresent();
      else if (a === 'exit') exitPresent();
      else if (a === 'next') showStep(presentIdx + 1);
      else if (a === 'prev') showStep(presentIdx - 1);
      else if (a === 'toggle-done') toggleCurrentDone();
      else if (a === 'theme') toggleTheme();
      else if (a === 'menu') toggleSidebar();
      else if (a === 'collapse') { if (isMobile()) document.body.classList.remove('nav-open'); else setCollapsed(true); }
      else if (a === 'vars') {
        const p = document.getElementById('vars-panel');
        p.hidden = !p.hidden;
        if (!p.hidden) p.querySelector('input').focus();
      }
      return;
    }
    if (e.target.closest('.nav-link')) document.body.classList.remove('nav-open');
  });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    const presenting = document.body.classList.contains('present');
    if (e.key === 'Escape') {
      if (presenting) exitPresent();
      document.getElementById('vars-panel').hidden = true;
      document.body.classList.remove('nav-open');
      if (typing) document.activeElement.blur();
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (presenting) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); showStep(presentIdx + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showStep(presentIdx - 1); }
      else if (e.key === 'Home') { e.preventDefault(); showStep(0); }
      else if (e.key === 'End') { e.preventDefault(); showStep(slides.length - 1); }
      else if (e.key === 'd' || e.key === 'D') toggleCurrentDone();
      else if (e.key === 'p' || e.key === 'P') exitPresent();
      return;
    }
    if (e.key === 'p' || e.key === 'P') enterPresent();
    else if (e.key === '[') toggleSidebar();
    else if (e.key === '/') {
      e.preventDefault();
      if (isMobile()) document.body.classList.add('nav-open'); else setCollapsed(false);
      search.focus();
    }
  });

  renderProgress();

  if (location.hash) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) requestAnimationFrame(() => target.scrollIntoView({ block: 'start' }));
  }
})();
</script>
</body>
</html>
